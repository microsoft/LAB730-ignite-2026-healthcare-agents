<svg xmlns="http://www.w3.org/2000/svg" width="6.6667in" height="7.5in" viewBox="0 0 960 1080" role="img" aria-labelledby="title description">
  <title id="title">From CT to a measured report: the MedImageParse workshop</title>
  <desc id="description">A concept illustration for half of a widescreen PowerPoint slide. Three workshop chapters introduce a CT-reporting agent and skill, MedImageParse segmentation through MCP, and patient context. The agent sends CT images and a prompt to MedImageParse and receives segmentation masks. Measurement tooling combines masks with CT spacing to calculate diameter and volume. A schematic CT overlay and draft abdominal CT report show an illustrative hepatic lesion measuring 24 millimeters and 6.8 milliliters. The anatomy and values are synthetic, not actual model output. Radiologist review is required.</desc>

