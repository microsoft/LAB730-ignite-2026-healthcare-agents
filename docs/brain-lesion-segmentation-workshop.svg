<svg xmlns="http://www.w3.org/2000/svg" width="6.6667in" height="7.5in" viewBox="0 0 960 1080" role="img" aria-labelledby="title description">
  <title id="title">From MRI to a measured report: the MedImageParse workshop</title>
  <desc id="description">A concept illustration. Three workshop chapters introduce a brain MRI reporting agent and skill, MedImageParse segmentation and lesion measurement through MCP, and patient context. The agent sends an axial brain MRI slice and a text prompt to MedImageParse and receives lesion masks. Measurement tooling combines the masks with pixel spacing to calculate lesion volumes and the longest and perpendicular diameters. A schematic axial MRI overlay and draft brain MRI report show an illustrative left frontal enhancing lesion measuring 32 by 24 millimeters.</desc>

