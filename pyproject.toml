[project]
name = "foundation-model-and-agents-workshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "mcp[cli]>=1.6",
    "nibabel>=5.4.2",
    "numpy>=2.4.4",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "tenacity>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop"]
