<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Chapter 2 pipeline: MedImageParse 3D segmentation and lesion descriptors through MCP</title>
  <desc id="description">A brain MRI volume path and text prompts go to the segment tool, which calls the MedImageParse 3D foundation model and returns a mask path. The mask path goes to clean_segmentation and describe_lesions, plain Python with no model, which return lesion volumes and diameters. All tools live in the medimageparse MCP server. The descriptors go through a factsheet to the write-report-simple skill from Chapter 1, which writes a draft report. Each step saves its files in an audit-log folder for the image: segment writes axial montages, the mask, and its prompt sidecar; clean_segmentation and describe_lesions write the cleaned and lesion masks, descriptors, and a measurement image; the agent writes the factsheet from the descriptors, and the report skill reads it. The write-report-measured skill orchestrates the calls. Values are illustrative.</desc>

