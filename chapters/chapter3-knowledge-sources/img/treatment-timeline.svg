<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">Chapter 3: the same scans, read in the context of the treatment timeline</title>
  <desc id="description">A timeline for the synthetic patient SYN0056 from August 2016 to April 2018: staging MRI with a 2.6 cm right parietal metastasis, radiosurgery in October 2016, an MRI in February 2017 at 3.5 by 3.7 cm, the prior MRI on 2017-06-13 at 4.3 by 3.4 cm, resection and a post-operative MRI with no nodular enhancement in August 2017, head CTs on dexamethasone with a 6 mm midline shift in April 2018, and the current MRI on 2018-04-14. A shaded band shows that comparing the current MRI with the prior crosses the resection. Below, a report written without the chart states that the tumor core increased 112 percent, while a report written with the chart says the mass is new since the post-operative MRI and frames it as recurrent tumor versus radiation necrosis. Values are illustrative.</desc>

  <rect width="1600" height="560" fill="#FFFFFF"/>
  <g font-family="Aptos, Segoe UI, Arial, sans-serif" letter-spacing="0">
    <rect x="80" y="40" width="28" height="5" fill="#087F78"/>
    <text x="120" y="49" font-size="18" font-weight="700" fill="#526169">CHAPTER 3 / THE SAME SCANS, IN CONTEXT</text>

    <rect x="756" y="118" width="656" height="182" fill="#FDF3DE"/>
    <text x="770" y="145" font-size="17" font-weight="700" fill="#956115">Comparing with _002 crosses the resection</text>

    <path d="M80 250 H1520" stroke="#8EA5A2" stroke-width="2.5"/>
    <g stroke="#8EA5A2" stroke-width="2">
      <path d="M80 244 V256 M405 244 V256 M1185 244 V256"/>
    </g>
    <g font-size="15" font-weight="700" fill="#71817F">
      <text x="86" y="284">2016</text>
      <text x="411" y="284">2017</text>
      <text x="1191" y="284">2018</text>
    </g>

    <circle cx="126" cy="250" r="9" fill="#FFFFFF" stroke="#526169" stroke-width="3"/>
    <text x="126" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#202C32">Staging MRI</text>
    <text x="126" y="196" text-anchor="middle" font-size="16" fill="#526169">Aug 2016 · 2.6 cm</text>

    <path d="M234 241 L243 250 L234 259 L225 250 Z" fill="#526169"/>
    <text x="234" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#202C32">Radiosurgery</text>
    <text x="234" y="339" text-anchor="middle" font-size="16" fill="#526169">Oct 2016</text>

    <circle cx="498" cy="250" r="9" fill="#FFFFFF" stroke="#526169" stroke-width="3"/>
    <text x="498" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#202C32">MRI · _001</text>
    <text x="498" y="196" text-anchor="middle" font-size="16" fill="#526169">Feb 2017 · 3.5 × 3.7 cm</text>

    <circle cx="756" cy="250" r="9" fill="#FFFFFF" stroke="#087F78" stroke-width="3"/>
    <text x="756" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#202C32">Prior MRI · _002</text>
    <text x="756" y="196" text-anchor="middle" font-size="16" fill="#526169">Jun 13, 2017 · 4.3 × 3.4 cm</text>

    <path d="M897 241 L906 250 L897 259 L888 250 Z" fill="#526169"/>
    <text x="897" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#202C32">Resection · post-op MRI _003</text>
    <text x="897" y="339" text-anchor="middle" font-size="16" fill="#526169">Aug 2017 · no nodular enhancement</text>

    <path d="M1388 241 L1397 250 L1388 259 L1379 250 Z" fill="#526169"/>
    <text x="1388" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#202C32">Head CTs · dexamethasone</text>
    <text x="1388" y="339" text-anchor="middle" font-size="16" fill="#526169">Apr 9–12, 2018 · 6 mm shift</text>

    <circle cx="1412" cy="250" r="12" fill="#F4C76D" stroke="#BD7C14" stroke-width="3"/>
    <text x="1412" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#202C32">Current MRI · _006</text>
    <text x="1412" y="196" text-anchor="middle" font-size="16" fill="#526169">Apr 14, 2018</text>

    <rect x="80" y="370" width="680" height="120" rx="6" fill="#F4F6F6" stroke="#D5DDDD" stroke-width="1.5"/>
    <text x="104" y="404" font-size="15" font-weight="700" fill="#71817F">WITHOUT THE CHART (CHAPTER 2)</text>
    <text x="104" y="440" font-size="21" fill="#202C32">Rim-enhancing mass, 6.2 × 4.6 cm;</text>
    <text x="104" y="468" font-size="21" fill="#202C32">tumor core up 112.1% since 2017-06-13.</text>

    <rect x="840" y="370" width="680" height="120" rx="6" fill="#EAF5F0" stroke="#9ACFBE" stroke-width="1.5"/>
    <text x="864" y="404" font-size="15" font-weight="700" fill="#245F51">WITH THE CHART (CHAPTER 3)</text>
    <text x="864" y="440" font-size="21" fill="#202C32">Lesion resected 2017-08; this mass is new since</text>
    <text x="864" y="468" font-size="21" fill="#202C32">the post-op MRI: recurrence vs radiation necrosis.</text>

    <path d="M770 430 H830 M821 423 L830 430 L821 437" fill="none" stroke="#087F78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1520" y="530" text-anchor="end" font-size="15" fill="#73827F">Synthetic patient SYN0056. Illustrative values; not for clinical use.</text>
  </g>
</svg>
